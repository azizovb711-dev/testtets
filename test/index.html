<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Savollar - 2 Kurs 4 Semestr</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d2e;
    --card2: #1e2235;
    --border: #2a2f4a;
    --accent1: #6c63ff;
    --accent2: #00e5ff;
    --correct: #00c471;
    --wrong: #ff4d6d;
    --text: #e8eaf6;
    --muted: #7c85b0;
    --gold: #ffd700;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(108,99,255,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(0,229,255,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== HOME SCREEN ===== */
  #home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    position: relative;
    z-index: 1;
  }

  .logo-icon {
    width: 90px; height: 90px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px;
    margin-bottom: 24px;
    box-shadow: 0 0 50px rgba(108,99,255,0.4);
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .home-title {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    text-align: center;
    background: linear-gradient(135deg, #fff 30%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    line-height: 1.2;
  }

  .home-sub {
    color: var(--muted);
    font-size: 15px;
    text-align: center;
    margin-bottom: 48px;
    max-width: 400px;
    line-height: 1.6;
  }

  .section-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
    max-width: 680px;
    margin-bottom: 32px;
  }

  @media (max-width: 500px) {
    .section-cards { grid-template-columns: 1fr; }
  }

  .sec-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .sec-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.25s;
  }

  .sec-card.s1::before { background: linear-gradient(135deg, rgba(108,99,255,0.15), transparent); }
  .sec-card.s2::before { background: linear-gradient(135deg, rgba(0,229,255,0.15), transparent); }

  .sec-card:hover { transform: translateY(-4px); border-color: var(--accent1); }
  .sec-card:hover::before { opacity: 1; }
  .sec-card.s2:hover { border-color: var(--accent2); }

  .sec-icon {
    font-size: 36px;
    margin-bottom: 14px;
    display: block;
  }

  .sec-name {
    font-family: 'Outfit', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .sec-meta {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 16px;
  }

  .sec-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 10px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    color: #fff;
  }

  .s1 .sec-btn { background: var(--accent1); }
  .s2 .sec-btn { background: linear-gradient(90deg, #0096c7, var(--accent2)); }
  .sec-btn:hover { transform: scale(1.05); }

  /* ===== QUIZ SCREEN ===== */
  #quiz { display: none; min-height: 100vh; position: relative; z-index: 1; }

  .quiz-header {
    background: rgba(26,29,46,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .back-btn {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .back-btn:hover { border-color: var(--accent1); color: var(--accent1); }

  .quiz-progress-wrap {
    flex: 1;
    min-width: 0;
  }

  .quiz-title-sm {
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .progress-bar-bg {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    transition: width 0.4s ease;
  }

  .score-badge {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    text-align: center;
  }

  .score-badge span { color: var(--gold); }

  /* Question area */
  .quiz-body {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 100px;
  }

  .q-counter {
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .q-text {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(17px, 2.5vw, 22px);
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 28px;
    color: #fff;
  }

  .answers-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .ans-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 15px;
    font-family: 'Noto Sans', sans-serif;
    color: var(--text);
    line-height: 1.45;
    position: relative;
    overflow: hidden;
  }

  .ans-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .ans-btn:hover:not(:disabled) { border-color: var(--accent1); transform: translateX(4px); }
  .ans-btn:hover:not(:disabled)::before { background: rgba(108,99,255,0.08); opacity: 1; }

  .ans-letter {
    width: 34px; height: 34px;
    min-width: 34px;
    border-radius: 9px;
    background: var(--card2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 14px;
    transition: all 0.2s;
    color: var(--muted);
  }

  .ans-text { flex: 1; }

  .ans-icon {
    font-size: 20px;
    opacity: 0;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }

  /* Correct answer */
  .ans-btn.correct {
    border-color: var(--correct) !important;
    background: rgba(0,196,113,0.1) !important;
    animation: pop 0.35s ease;
  }
  .ans-btn.correct .ans-letter {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }
  .ans-btn.correct .ans-icon { opacity: 1; }
  .ans-btn.correct::before { background: rgba(0,196,113,0.05); opacity: 1; }

  /* Wrong answer */
  .ans-btn.wrong {
    border-color: var(--wrong) !important;
    background: rgba(255,77,109,0.1) !important;
    animation: shake 0.4s ease;
  }
  .ans-btn.wrong .ans-letter {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }
  .ans-btn.wrong .ans-icon { opacity: 1; }

  /* Show correct after wrong selection */
  .ans-btn.show-correct {
    border-color: var(--correct) !important;
    background: rgba(0,196,113,0.06) !important;
  }
  .ans-btn.show-correct .ans-letter {
    background: rgba(0,196,113,0.3);
    border-color: var(--correct);
    color: var(--correct);
  }

  .ans-btn:disabled { cursor: not-allowed; transform: none !important; }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* Feedback toast */
  .feedback-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: 14px 28px;
    border-radius: 14px;
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 700;
    transition: transform 0.3s ease;
    z-index: 999;
    pointer-events: none;
    white-space: nowrap;
  }
  .feedback-toast.show { transform: translateX(-50%) translateY(0); }
  .feedback-toast.correct-toast { background: var(--correct); color: #fff; }
  .feedback-toast.wrong-toast { background: var(--wrong); color: #fff; }

  /* Next button */
  .next-btn {
    position: fixed;
    bottom: 80px;
    right: 24px;
    background: linear-gradient(135deg, var(--accent1), #9c6fff);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 28px;
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: none;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 30px rgba(108,99,255,0.4);
    transition: all 0.2s;
    z-index: 50;
  }
  .next-btn:hover { transform: scale(1.05); box-shadow: 0 12px 40px rgba(108,99,255,0.5); }
  .next-btn.visible { display: flex; animation: slideUp 0.3s ease; }

  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* ===== RESULT SCREEN ===== */
  #result {
    display: none;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    z-index: 1;
  }

  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .result-emoji {
    font-size: 72px;
    margin-bottom: 20px;
    animation: bounce 0.6s ease;
    display: block;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    40% { transform: translateY(-20px); }
  }

  .result-title {
    font-family: 'Outfit', sans-serif;
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 12px;
  }

  .result-score-big {
    font-family: 'Outfit', sans-serif;
    font-size: 64px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--gold), #ffaa00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 12px 0;
    line-height: 1;
  }

  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 24px 0 32px;
  }

  .stat-box {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .stat-box .num {
    font-family: 'Outfit', sans-serif;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .stat-box .lbl { color: var(--muted); font-size: 13px; }
  .stat-box.c .num { color: var(--correct); }
  .stat-box.w .num { color: var(--wrong); }

  .result-btns {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .r-btn {
    padding: 14px 24px;
    border-radius: 12px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .r-btn.primary { background: linear-gradient(135deg, var(--accent1), #9c6fff); color: #fff; }
  .r-btn.secondary { background: var(--card2); border: 1px solid var(--border); color: var(--text); }
  .r-btn:hover { transform: scale(1.03); }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
    pointer-events: none;
    z-index: 9999;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Particle on correct */
  .particle {
    position: fixed;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    animation: particleFly 0.6s ease forwards;
  }
  @keyframes particleFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }
</style>
</head>

<!-- HOME SCREEN -->
<div id="home">
  <div class="logo-icon">📚</div>
  <h1 class="home-title">Test Savollar</h1>
  <p class="home-sub">2-kurs 4-semestr · Axborot texnologiyalari & Jahon Adabiyoti</p>

  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">

<!-- RESULT SCREEN -->
<div id="result">

    <div style="color:var(--muted);font-size:14px;margin-bottom:8px;" id="resultPct"></div>
    <div class="result-stats">
      <div class="stat-box c">
        <div class="num" id="rCorrect">0</div>
        <div class="lbl">✓ To'g'ri</div>
      </div>
      <div class="stat-box w">
        <div class="num" id="rWrong">0</div>
        <div class="lbl">✗ Noto'g'ri</div>
      </div>
    </div>
    <div class="result-btns">
      <button class="r-btn primary" id="retryBtn">🔄 Qayta urinish</button>
      <button class="r-btn secondary" onclick="goHome()">🏠 Bosh sahifa</button>
    </div>
  </div>
</div>

<!-- Feedback Toast -->
<div class="feedback-toast" id="feedbackToast"></div>

// Shuffle array
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let state = {
  section: 0,
  questions: [],
  current: 0,
  score: 0,
  wrong: 0,
  answered: false
};

function startQuiz(sectionIdx) {
  state.section = sectionIdx;
  const raw = sectionIdx === 0 ? DATA.section1 : DATA.section2;
  // Shuffle questions
  state.questions = shuffle(raw).map(q => {
    // Shuffle answers within each question
    const shuffled = shuffle(q.answers);
    const newCorrect = shuffled.findIndex(a => a.correct);
    return { q: q.q, answers: shuffled, correct: newCorrect };
  });
  state.current = 0;
  state.score = 0;
  state.wrong = 0;
  state.answered = false;

  document.getElementById('home').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';

  const titles = ['Bo\'lim 1 — Axborot Texnologiyalari', 'Bo\'lim 2 — Jahon Adabiyoti'];
  document.getElementById('quizTitleSm').textContent = titles[sectionIdx];

  renderQuestion();
}

function renderQuestion() {
  const q = state.questions[state.current];
  const total = state.questions.length;
  state.answered = false;

  document.getElementById('qCounter').textContent = `Savol ${state.current + 1} / ${total}`;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('scoreDisp').textContent = state.score;
  document.getElementById('progressFill').style.width = `${(state.current / total) * 100}%`;

  const grid = document.getElementById('answersGrid');
  grid.innerHTML = '';

  q.answers.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.onclick = () => handleAnswer(i, btn);

    const icon = ans.correct ? '✓' : '✗';

    btn.innerHTML = `
      <div class="ans-letter">${LETTERS[i]}</div>
      <div class="ans-text">${ans.text}</div>
      <div class="ans-icon">${ans.correct ? '✓' : '✗'}</div>
    `;
    grid.appendChild(btn);
  });

  document.getElementById('nextBtn').classList.remove('visible');
  document.getElementById('nextBtn').style.display = 'none';
}

function handleAnswer(idx, btn) {
  if (state.answered) return;
  state.answered = true;

  const q = state.questions[state.current];
  const allBtns = document.querySelectorAll('.ans-btn');
  allBtns.forEach(b => b.disabled = true);

  const isCorrect = idx === q.correct;

  if (isCorrect) {
    btn.classList.add('correct');
    state.score++;
    showToast('✓  To\'g\'ri javob!', 'correct-toast');
    spawnParticles(btn);
  } else {
    btn.classList.add('wrong');
    state.wrong++;
    showToast('✗  Noto\'g\'ri!', 'wrong-toast');
    // Show correct
    allBtns[q.correct].classList.add('show-correct');
  }

  document.getElementById('scoreDisp').textContent = state.score;

  const nextBtn = document.getElementById('nextBtn');
  const isLast = state.current === state.questions.length - 1;
  document.getElementById('nextLabel').textContent = isLast ? '🏁' : '→';
  nextBtn.style.display = 'flex';
  nextBtn.classList.add('visible');
}

function nextQuestion() {
  state.current++;
  if (state.current >= state.questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  const result = document.getElementById('result');
  result.style.display = 'flex';

  const total = state.questions.length;
  const pct = Math.round((state.score / total) * 100);

  let emoji, title;
  if (pct >= 90) { emoji = '🏆'; title = 'Ajoyib natija!'; }
  else if (pct >= 70) { emoji = '🎉'; title = 'Yaxshi!'; }
  else if (pct >= 50) { emoji = '💪'; title = 'Davom eting!'; }
  else { emoji = '📚'; title = 'Ko\'proq o\'qing!'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScoreBig').textContent = `${state.score}/${total}`;
  document.getElementById('resultPct').textContent = `${pct}% to'g'ri`;
  document.getElementById('rCorrect').textContent = state.score;
  document.getElementById('rWrong').textContent = state.wrong;

  document.getElementById('retryBtn').onclick = () => startQuiz(state.section);

  if (pct >= 70) launchConfetti();
}

function goHome() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('home').style.display = 'flex';
}

// Toast
let toastTimer;
function showToast(msg, cls) {
  const t = document.getElementById('feedbackToast');
  t.textContent = msg;
  t.className = `feedback-toast ${cls} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}

// Particles on correct answer
function spawnParticles(btn) {
  const rect = btn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const colors = ['#00c471','#6c63ff','#ffd700','#00e5ff','#ff6b6b'];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (i / 12) * 360;
    const dist = 40 + Math.random() * 60;
    const tx = Math.cos(angle * Math.PI / 180) * dist;
    const ty = Math.sin(angle * Math.PI / 180) * dist;
    p.style.cssText = `left:${cx}px;top:${cy}px;background:${colors[i%colors.length]};--tx:${tx}px;--ty:${ty}px;`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}

// Confetti
function launchConfetti() {
  const colors = ['#6c63ff','#00e5ff','#ffd700','#ff6b6b','#00c471','#ff9f43'];
  for (let i = 0; i < 80; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      c.style.cssText = `
        left:${Math.random()*100}vw;
        top:-10px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        animation-duration:${2+Math.random()*2}s;
        animation-delay:${Math.random()*0.5}s;
        transform:rotate(${Math.random()*360}deg);
        width:${6+Math.random()*6}px;
        height:${6+Math.random()*6}px;
      `;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }, i * 30);
  }
}

// Keyboard support
document.addEventListener('keydown', e => {
  if (document.getElementById('quiz').style.display === 'none') return;
  const keys = { 'a':0,'b':1,'c':2,'d':3,'1':0,'2':1,'3':2,'4':3 };
  const idx = keys[e.key.toLowerCase()];
  if (idx !== undefined && !state.answered) {
    const btns = document.querySelectorAll('.ans-btn');
    if (btns[idx]) handleAnswer(idx, btns[idx]);
  }
  if ((e.key === 'Enter' || e.key === 'ArrowRight') && state.answered) {
    nextQuestion();
  }
});
